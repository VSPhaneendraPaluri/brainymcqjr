services:
  - type: web
    name: brainymcq-junior
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class sync --workers 4 --bind 0.0.0.0:$PORT --timeout 120 "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brainymcq-db
          property: connectionString

databases:
  - name: brainymcq-db
    plan: free
    region: oregon
    databaseName: brainymcq
    user: brainymcq
